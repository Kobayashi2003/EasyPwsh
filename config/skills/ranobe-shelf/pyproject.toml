[project]
name = "ranobe-shelf"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["ruff", "basedpyright"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
exclude = ["var"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["scripts"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"
